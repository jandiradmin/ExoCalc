name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Engine self-test
        run: node tests/selftest.mjs

      - name: Build installer
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # latest.json tells installed copies which version is newest and where the signed installer is.
      - name: Updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          NAME=$(basename "$EXE")
          node -e '
            const fs = require("fs");
            const [exe, name, tag] = process.argv.slice(1);
            const m = {
              version: tag.replace(/^v/, ""),
              notes: "",
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(exe + ".sig", "utf8").trim(),
                url: `https://github.com/jandiradmin/ExoCalc/releases/download/${tag}/${name}`,
              } },
            };
            fs.writeFileSync("src-tauri/target/release/bundle/latest.json", JSON.stringify(m, null, 2));
          ' "$EXE" "$NAME" "$GITHUB_REF_NAME"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ExoCalc-Windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/nsis/*.exe.sig
            windows/src-tauri/target/release/bundle/msi/*.msi
            windows/src-tauri/target/release/bundle/latest.json
